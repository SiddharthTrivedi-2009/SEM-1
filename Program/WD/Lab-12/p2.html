<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient</title>
    <!-- Row 1
     Box 1: #5bfda1 ➔ #58e4bd ➔ #52bcdb ➔ #4ca1ff 
     Box 2: #5ddcd6 ➔ #59cfdf ➔ #53b8ef ➔ #4ea7ff
     Box 3: #ffb372 ➔ #f4909a ➔ #db6ec9 ➔ #c352ff
     Row 2
     Box 4: #ff8093 ➔ #ff878f ➔ #ff918a ➔ #ff9b86
     Box 5: #9b9fff ➔ #b9adff ➔ #dabeff ➔ #f7cdff
     Box 6: #ff2640 ➔ #ff2c5c ➔ #ff357d ➔ #ff3ea5
     Row 3
     Box 7: #ff53c0 ➔ #ca55bd ➔ #8257b7 ➔ #3559b3
     Box 8: #fff244 ➔ #ffed50 ➔ #ffe85f ➔ #ffe56b
     Box 9: #ff5b94 ➔ #ff6b8b ➔ #ff7e82 ➔ #ff907b
     Row 4
     Box 10: #f4ffa1 ➔ #d1fba7 ➔ #aeedd4 ➔ #91f1b2
     Box 11: #ffd3bb ➔ #f9d4cd ➔ #f3d5df ➔ #edd6f2
     Box 12: #ff0d43 ➔ #ff3233 ➔ #ff5b21 ➔ #ff7f12
     Row 5
     Box 13: #fffae3 ➔ #e4ebd3 ➔ #cad7c3 ➔ #b5c4b3
     Box 14: #9240df ➔ #b75bc0 ➔ #dc779f ➔ #ff927f
     Box 15: #00ca8d ➔ #00bcaf ➔ #00acd2 ➔ #009eff -->
    <style>
        .table{
            background-color: #1e0261;
            width: 44%;
            padding: 25px;
            border-radius: 15px;
        }
         .row1{
            display: flex;
         }
         .row2{
            display: flex;
         }
         .row3{
            display: flex;
         }
         .row4{
            display: flex;
         }
         .row5{
            display: flex;
         }
        .box1{
            height: 100px;
            width: 200px;
            margin: 10px;
            border-radius: 10px;
            background: linear-gradient(to left top, #5bfda1,#58e4bd,#52bcdb,#4ca1ff);
        }
        .box2{
            height: 100px;
            width: 200px;
            margin: 10px;
            border-radius: 10px;
            background: linear-gradient(to right top,#5ddcd6 ,#59cfdf,#53b8ef,#4ea7ff);
        }
        .box3{
            height: 100px;
            width: 200px;
            margin: 10px;
            border-radius: 10px;
            background: linear-gradient(to right top,#ffb372 , #f4909a,#db6ec9,#c352ff);
        }
        .box4{
            height: 100px;
            width: 200px;
            margin: 10px;
            border-radius: 10px;
            background: linear-gradient(to right bottom,#ff8093,#ff878f,#ff918a,#ff9b86);
        }
        .box5{
            height: 100px;
            width: 200px;
            margin: 10px;
            border-radius: 10px;
            background: linear-gradient(to right bottom,#9b9fff,#b9adff,#dabeff,#f7cdff);
        }
        .box6{
            height: 100px;
            width: 200px;
            margin: 10px;
            border-radius: 10px;
            background: linear-gradient(to right top,#ff2640,#ff2c5c,#ff357d,#ff3ea5);
        }
        .box7{
            height: 100px;
            width: 200px;
            margin: 10px;
            border-radius: 10px;
            background: linear-gradient(to right bottom,#ff53c0,#ca55bd,#8257b7,#3559b3);
        }
        .box8{
            height: 100px;
            width: 200px;
            margin: 10px;
            border-radius: 10px;
            background: linear-gradient(to left top,#fff244,#ffed50,#ffe85f,#ffe56b);
        }
        .box9{
            height: 100px;
            width: 200px;
            margin: 10px;
            border-radius: 10px;
            background: linear-gradient(to right bottom,#ff5b94,#ff6b8b,#ff7e82,#ff907b);
        }
        .box10{
            height: 100px;
            width: 200px;
            margin: 10px;
            border-radius: 10px;
            background: linear-gradient(to right bottom,#f4ffa1,#d1fba7,#aeedd4,#91f1b2);
        }
        .box11{
            height: 100px;
            width: 200px;
            margin: 10px;
            border-radius: 10px;
            background: linear-gradient( to right,#ffd3bb,#f9d4cd,#f3d5df,#edd6f2);
        }
        .box12{
            height: 100px;
            width: 200px;
            margin: 10px;
            border-radius: 10px;
            background: linear-gradient(to bottom,#ff0d43,#ff3233,#ff5b21,#ff7f12);
        }
        .box13{
            height: 100px;
            width: 200px;
            margin: 10px;
            border-radius: 10px;
            background: linear-gradient(to right top,#fffae3,#e4ebd3,#cad7c3,#b5c4b3);
        }
        .box14{
            height: 100px;
            width: 200px;
            margin: 10px;
            border-radius: 10px;
            background: linear-gradient(to bottom left,#9240df,#b75bc0,#dc779f,#ff927f);
        }
        .box15{
            height: 100px;
            width: 200px;
            margin: 10px;
            border-radius: 10px;
            background: linear-gradient(to right top,#00ca8d,#00bcaf,#00acd2,#009eff);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="table">
            <div class="row1" id="box">
              <div class="box1"></div>
              <div class="box2"></div>
              <div class="box3"></div>
            </div>
            <div class="row2" id="box">
              <div class="box4"></div>
              <div class="box5"></div>
              <div class="box6"></div>
            </div>
            <div class="row3" id="box">
              <div class="box7"></div>
              <div class="box8"></div>
              <div class="box9"></div>
            </div>
            <div class="row4" id="box">
              <div class="box10"></div>
              <div class="box11"></div>
              <div class="box12"></div>
            </div>
            <div class="row5" id="box">
              <div class="box13"></div>
              <div class="box14"></div>
              <div class="box15"></div>
            </div>
        </div>
    </div>
</body>
</html>
