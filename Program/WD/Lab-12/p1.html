<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiant</title>
    <style>
        .container{
            display: flex;
        }
        .box1{
            height: 300px;
            width: 300px;
            background: linear-gradient(red,orange,yellow);
            border-radius: 10px;
        }
        .box2{
            height: 300px;
            width: 350px;
            margin-left: 10px;
            background: radial-gradient(red 20%,orange 30%,yellow 40%,green 100%);
            border-radius: 10px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box1">

        </div>
        <div class="box2">

        </div>
    </div>
</body>
</html>
