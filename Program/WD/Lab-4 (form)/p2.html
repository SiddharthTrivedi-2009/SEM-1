<html>
  <head>
    <title>Covid-19</title>
  </head>
  <body align="center">
    <table align="center" cellpadding="10">
      <form>
        <h1>Covid-19 Vaccine Registration Form</h1>
        <tr>
          <td>
            <label for="First Name">First Name</label>
          </td>
          <td>
            <input type="text" name=" First Name" id="First Name" />
          </td>
        </tr>
        <tr>
          <td>
            <label for="Last Name">Last Name</label>
          </td>
          <td>
            <input type="text" name="Last Name" id="Last Name" />
          </td>
        </tr>
        <tr>
          <td>
            <label for="Aadhar no.">Aadhar no.</label>
          </td>
          <td>
            <input type="number" name="Aadhar no." id="Aadhar no." />
          </td>
        </tr>
        <tr>
          <td>
            <label for="Vaccine Name">Vaccine Name</label>
          </td>
          <td>
            <select name="Vaccine Name" id="Vaccine Name">
              <option value="Select Vaccine Name" disabled selected>
                Select Vaccine Name
              </option>
              <option>a1</option>
              <option>a2</option>
              <option>a3</option>
              <option>a4</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>
            <label for="Vaccine Center Name">Vaccine Name</label>
          </td>
          <td>
            <select name="Vaccine Center Name" id="Vaccine Center Name">
              <option value="Select Vaccine Center Name" disabled selected>
                Select Vaccine Center Name
              </option>
              <option>b1</option>
              <option>b2</option>
              <option>b3</option>
              <option>b4</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>
            <lable for="Date Of Vaccine">Date Of Vaccine</lable>
          </td>
          <td>
            <input type="date" name="Date Of Vaccine" id="Date Of Vaccine" />
          </td>
        </tr>
        <tr>
          <td>
            <lable for="Dose NO."> Dose No.</lable>
          </td>
          <td>
            <input type="number" range="1" name="Dose No." id="Dose No." />
          </td>
        </tr>
        <tr>
          <td>
            <label for="CLICK HERE"></label>
          </td>
          <td>
            <input type="submit" id="CLICK HERE" value="CLICK HERE" />
          </td>
          <td>
            <label for="CANCEL"></label>
          </td>
          <td>
            <input type="reset" id="CANCEL" value="CANCEL" />
          </td>
        </tr>
      </form>
    </table>
  </body>
</html>
