<html>
  <head>
    <title>STUDENT REGISTRATION</title>
  </head>
  <body align="center">
    <h1>STUDENT REGISTRATION</h1>
    <table align="center" cellpadding="10">
      <form>
        <tr>
          <td>
            <label for="">Full Name</label>
          </td>
          <td>
            <input type="text" id="Name" name="Name" />
          </td>
        </tr>
        <tr>
          <td>
            <lable for="">Email</lable>
          </td>
          <td>
            <input type="email" name="Email" id="Email" />
          </td>
        </tr>
        <tr>
          <td>
            <label for="">Mobile No.</label>
          </td>
          <td>
            <input type="tel" name="Mobile No." id="Mobile No." />
          </td>
        </tr>
        <tr>
          <td>
            <label for="">Address</label>
          </td>
          <td>
            <textarea name="Address" id="Address"></textarea>
          </td>
        </tr>
        <tr>
          <td>
            <label for="">Nationality</label>
          </td>
          <td>
            <input type="text" name="Nationality" id="Nationality" />
          </td>
        </tr>
        <tr>
          <td>
            <label for="">Date Of Birth</label>
          </td>
          <td>
            <input type="date" name="DOB" id="DOB" />
          </td>
        </tr>
        <tr>
          <td>
            <label for="">Gender</label>
          </td>
          <td>
            <input type="radio" name="Gender" id="Male" value="male" />male
            <input
              type="radio"
              name="Gender"
              id="Female"
              value="Female"
            />Female
          </td>
        </tr>
        <tr>
          <td>
            <label for="">Highest Degree</label>
          </td>
          <td>
            <select>
              <option value="Select Degree" disabled selected>
                Select Degree
              </option>
              <option>B.TECH</option>
              <option>BCA</option>
              <option>BSC</option>
              <option>M.Tech</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>
            <label for=""> CPI </label>
          </td>
          <td>
            <input type="number" name="CPI" id="CPI" />
          </td>
        </tr>
        <tr>
          <td>
            <label for="">University</label>
          </td>
          <td>
            <input type="text" name="University" id="University" />
          </td>
        </tr>
        <tr>
          <td>
            <label for="">Passing Year</label>
          </td>
          <td>
            <select>
              <option value="Enter Your Passing Year" disabled selected>
                Enter Your Passing Year
              </option>
              <option>2015</option>
              <option>2016</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>
            <lable for=""></lable>
          </td>
          <td>
            <input type="submit" name="submit" id="" />
          </td>
          <td>
            <input type="reset" name="cancel" id="" />
          </td>
        </tr>
      </form>
    </table>
  </body>
</html>
