<html>
  <head>
    <title>Account Form</title>
  </head>
  <body align="center">
    <header style="background-color: aquamarine">
      <h1>Create Account</h1>
    </header>
    <table align="center" cellpadding="5">
      <form>
        <tr>
          <td>
            <label for=" First Name*" style="color: blue">First Name*</label>
          </td>
          <td>
            <label for="Last Name" style="color: blue">Last Name</label>
          </td>
        </tr>
        <tr>
          <td>
            <input
              type="text"
              name="Name"
              id="First Name*"
              placeholder="Enter Your First Name"
              required
            />
          </td>
          <td>
            <input
              type="text"
              name="Name"
              id="Last Name"
              placeholder="Enter Your Last Name"
            />
          </td>
        </tr>
        <tr>
          <td>
            <label for="Email*" style="color: blue">Email*</label>
          </td>
        </tr>
        <tr>
          <td>
            <input
              type="email"
              name="Email"
              id="Email*"
              placeholder="Enter Your Email"
              required
            />
          </td>
        </tr>
        <tr>
          <td>
            <lable for="Password*" style="color: blue">Password*</lable>
          </td>
          <td>
            <lable for="Confirm Password*" style="color: blue"
              >Confirm Password*</lable
            >
          </td>
        </tr>
        <tr>
          <td>
            <input
              type="password"
              name="Password"
              id="Password*"
              placeholder="Enter Password"
              required
            />
          </td>
          <td>
            <input
              type="password"
              name="Confirm Password"
              id="Confirm Password*"
              placeholder=" Enter Password"
              required
            />
          </td>
        </tr>
        <tr>
          <td>
            <label for="Gender" style="color: blue">Gender</label>
          </td>
          <td>
            <label for="Hobbies" style="color: blue">Hobbies</label>
          </td>
        </tr>
        <tr>
          <td>
            <input type="radio" name="Gender" id="Gender" value="Male" />Male
            <input
              type="radio"
              name="Gender"
              id="Gender"
              value=" Female"
            />Female
          </td>
          <td>
            <input
              type="checkbox"
              name="Hobbies"
              id="Hobbies"
              value="Music"
            />Music
            <input
              type="checkbox"
              name="Hobbies"
              id="Hobbies"
              value="Sports"
            />Sports
            <input
              type="checkbox"
              name="Hobbies"
              id="Hobbies"
              value="Travel"
            />Travel
            <input
              type="checkbox"
              name="Hobbies"
              id="Hobbies"
              value="Movie"
            />Movie
          </td>
        </tr>
        <tr>
          <td>
            <label for="Source Of Income" style="color: blue"
              >Source Of Income</label
            >
          </td>
          <td>
            <lable for="Income" style="color: blue">Income</lable>
          </td>
        </tr>
        <tr>
          <td>
            <select>
              <option selected>Employee</option>
              <option>Other</option>
            </select>
          </td>
          <td>
            <input type="range" name="Income" id="Income" min="0" max="20000" />
          </td>
        </tr>
        <tr>
          <td>
            <lable for="Choose Profile Picture" style="color: blue"
              >Choose Profile Picture</lable
            >
          </td>
          <td>
            <label for="Age" style="color: blue"> Age </label>
          </td>
        </tr>
        <tr>
          <td>
            <input type="file" name="Picture" id="Choose Profile Picture" />
          </td>
          <td>
            <input type="number" name="Age" id="Age" />
          </td>
        </tr>
        <tr>
          <td>
            <label for="Bio" style="color: blue">Bio</label>
          </td>
        </tr>
        <tr rowspan="2">
          <td>
            <textarea name="Bio" id="Bio"></textarea>
          </td>
        </tr>
        <tr>
          <footer>
            <td></td>
            <td>
              <input
                type="submit"
                name="submit"
                style="background-color: blue"
              />
            </td>
          </footer>
        </tr>
      </form>
    </table>
  </body>
</html>
