<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>lab 22-B</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div class="container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQzwFSXk1ZChjhctoBZOkZpCnRY99vC5qf-qTUNsCtx8w&s=10 " height="100px" class="rounded mx-auto d-block mt-3 " alt="...">
    
    <div class="h2 text-center mt-3">Checkout Form</div>
    <p class="text-center mx-5 px-5">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Atque quis dolore ea natus molestias voluptates vel quidem illum voluptatibus, reiciendis sed itaque nisi quo accusantium, quod laboriosam soluta similique! Commodi!</p>

    <div class="row">
        <div class="col-8">
            <div class="h3">Billing Address</div>
            <div class="row">
                <div class="col">
                    <label for="exampleFormControlInput1" class="form-label">First Name</label>
                    <input class="form-control" type="text" placeholder="Enter Your First Name" aria-label="default input example">
                </div>
                <div class="col">
                    <label for="exampleFormControlInput1" class="form-label">Last Name</label>
                    <input class="form-control" type="text" placeholder="Enter Your Last Name" aria-label="default input example">
                </div>
            </div>
            <label for="exampleFormControlInput1" class="form-label mt-3">Username</label>
            <div class="input-group">
                <div class="input-group-text" id="basic-addon1">@</div>
                <input type="text" class="form-control " placeholder="Username" aria-label="Username" aria-describedby="basic-addon1">
            </div>
            <div class="mt-3">
                <label for="exampleFormControlInput1" class="form-label">Email</label>
                <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="Enter Your Email">
              </div>
              <div class="mt-3">
                <label for="exampleFormControlInput1" class="form-label">Address</label>
                <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="Enter Your Address">
              </div>
              <div class="mt-3">
                <label for="exampleFormControlInput1" class="form-label">Address 2</label>
                <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="Enter Your Address">
              </div>
            <div class="row mt-3">
                <div class="col-5">
                    <label for="exampleFormControlInput1" class="form-label">Country</label>
                    <select class="form-select" aria-label="Default select example">
                        <option selected>choose....</option>
                        <option value="1">India</option>
                        <option value="2">India</option>
                        <option value="3">India</option>
                      </select>
                </div>
                <div class="col-4">
                    <label for="exampleFormControlInput1" class="form-label">State</label>
                    <select class="form-select" aria-label="Default select example">
                        <option selected>choose....</option>
                        <option value="1">Gujrat</option>
                        <option value="2">Maharastra</option>
                        <option value="3">M.P.</option>
                      </select>
                </div>
                <div class="col-3">
                    <label for="exampleFormControlInput1" class="form-label">Zip</label>
                <input class="form-control" type="text" placeholder="" aria-label="default input example">
                </div>
            </div>
            <hr>
            <div class="form-check mt-3">
                <input class="form-check-input-danger" type="checkbox" value="" id="checkDefault">
                <label class="form-check-label" for="checkDefault">
                  Shipping address is same as the billing address
                </label>
              </div>
            <div class="form-check">
                <input class="form-check-input-danger" type="checkbox" value="" id="checkDefault">
                <label class="form-check-label" for="checkDefault">
                  Save this information for next time
                </label>
              </div>
              <hr>
            <div class="h3">
                Payment
            </div>
            <div class="form-check mt-2">
                <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" checked>
                <label class="form-check-label" for="radioDefault2">
                  Credit Card
                </label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
                <label class="form-check-label" for="radioDefault1">
                  Debit Card
                </label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
                <label class="form-check-label" for="radioDefault1">
                  PayPal
                </label>
              </div>
            <div class="row mt-3">
                <div class="col">
                    <label for="exampleFormControlInput1" class="form-label">Name on card</label>
                    <input class="form-control" type="text" placeholder="" aria-label="default input example">
                    <small class="text-body-tertiary">Full Name as displayed on card</small>
                </div>
                <div class="col">
                    <label for="exampleFormControlInput1" class="form-label">Credit card number</label>
                    <input class="form-control" type="text" placeholder="" aria-label="default input example">
                </div>  
            </div>  
            <div class="row mt-3">
              <div class="col-3">
                <label for="exampleFormControlInput1" class="form-label">Expiration</label>
                    <input class="form-control" type="text" placeholder="" aria-label="default input example">
              </div>
              <div class="col-3">
                <label for="exampleFormControlInput1" class="form-label">CVV</label>
                    <input class="form-control" type="text" placeholder="" aria-label="default input example">
              </div>
              <div class="col-6"></div>
            </div>
            <hr>
            <button type="button" class="btn btn-primary w-100">Continue to checkout</button>
        </div>
        <div class="col-4">
            
        </div>
    </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
