<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOX</title>
    <style>
        .page{
            background-color: aqua;
            padding: 5px;
        }
        .header{
            background-color: purple;
            margin-left: 5px;
        }
        .content{
            background-color: orange;
            display: flex;
            gap: 20px;
            height: 200px;
            margin-left: 5px;
        }
        .footer{
            background-color: blue;
            margin-left: 5px;
        }
        .entry{
            color: white;
            background-color: black;
            padding: 5px;
            margin-bottom: 5px;
            margin-top: 5px;
            margin-left: 5px;
        }
        .sidebar{
           color: white;
            background-color: black; 
            height: 90px;
            margin-top: 25px;
        }
        .leftside{
            width: 70%;
        }
        .rightside{
            width: 30%;
        }
        @media (max-width: 500px){
            .content{
             flex-direction: column;
             height: 400px;
            }
            .sidebar{
                height: 50px;
                width: 100%;
            }
            .entry{
                width: 100%;
                margin-left: 0px;
            }
            .leftside{
                width: 100%;
            }
            .rightside{
                width: 100%;
            }
        }
    </style>
</head>
<body>
 <div class="page">
   page
   <div class="header">
    Header
   </div>
   <div class="content">
    <div class="leftside">
        <div>Content</div>
        <div class="entry">Entry</div>
        <div class="entry">Entry</div>
        <div class="entry">Entry</div>
    </div>
    <div class="rightside">
        <div class="sidebar">Sidebar</div>
    </div>
   </div>
   <div class="footer">&copy; Darshan University Rajkot</div>
 </div>   
</body>
</html>
