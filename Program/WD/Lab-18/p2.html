<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
  <div class="offcanvas offcanvas-start show text-bg-dark col-2 w-auto" tabindex="-1" id="offcanvasDark"
    aria-labelledby="offcanvasDarkLabel" data-bs-backdrop="false">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title w-100 text-center" id="offcanvasDarkLabel">Admin Group</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvasDark"
        aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <nav class="navbar bg-dark">
        <form class="container-fluid">
          <div class="input-group">
            <span class="input-group-text" id="basic-addon1"><svg xmlns="http://www.w3.org/2000/svg" width="16"
                height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                <path
                  d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
              </svg></span>
            <input type="text" class="form-control" aria-label="Username" aria-describedby="basic-addon1" />
          </div>
        </form>
      </nav>
      <div class="d-flex flex-column gap-3 p-3">
        <div class=" d-flex align-item-center gap-3"><i class="bi bi-bar-chart-fill"></i>Dashboard</div>
        <div class=" d-flex align-item-center gap-3"><i class="bi bi-file-earmark-fill"></i>Pages</div>
        <div class=" d-flex align-item-center gap-3"><i class="bi bi-list-ul"></i>Admin<i class="bi bi-chevron-right ms-auto"></i></div>
        <div class=" d-flex align-item-center gap-3"><i class="bi bi-gear-wide-connected"></i>Helpers<i class="bi bi-chevron-right ms-auto"></i></div>
        <div class=" d-flex align-item-center gap-3"><i class="bi bi-file-earmark-fill"></i>Media Manager</div>
        <div class=" d-flex align-item-center gap-3"><i class="bi bi-toggle-on"></i>Confi</div>
        <div class=" d-flex align-item-center gap-3"><i class="bi bi-sliders2"></i>Api Slider</div>
        <div class=" d-flex align-item-center gap-3"><i class="bi bi-images"></i>Page Designer</div>
      </div>
    </div>
  </div>
  <div class="col-10 container-fluid mt-4 mb-4">
   <div class=" col-10 ms-auto d-flex ">
                        <i class="bi bi-list"></i>
                <p class="ms-auto"><i class="bi bi-person-circle"></i>Administrator</p>

  </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
