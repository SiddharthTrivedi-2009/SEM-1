<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    
       <div class="container-fluid">
         <p class="h1">Complex Bootstrep Form</p>
        <form action="">
            <div class="row">
            <div class="col">
                <label for="" class="form-label">First Name</label>
                <input type="text" class="form-control" placeholder="Enter Your First Name">
            </div>
            <div class="col">
                <label for="" class="form-label">Last Name</label>
                <input type="text" class="form-control" placeholder="Enter Your Last Name">
            </div>
        </div>
        <div class="row mx-1">
            <label for="" class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Enter Your Email">
        </div>
        <div class="row">
            <div class="col">
                <lable class="form-label">Password</lable>
                <input type="password" class="form-control" placeholder="Enter Password">
            </div>
            <div class="col">
                <label for="" class="form-lebal">Confirm Password</label>
                <input type="password" class="form-control" placeholder="Enter Confirm Password">
            </div>
        </div>
        <div class="row mx-1">
            <label for="" class="form-label">Address</label>
            <input type="text" class="form-control" placeholder="1234">
        </div>
        <div class="row">
            <div class="col-6">
                <lable class="form-label">City</lable>
                <input type="text" class="form-control" placeholder="Enter City">
            </div>
            <div class="col-4">
                <label for="" class="form-label">State</label>
                <select name="" id="" class="form-select">
                    <option value="">Gujrat</option>
                    <option value="">Rajsthan</option>
                    <option value="">Punjab</option>
                </select>
            </div>
            <div class="col-2">
                <label for="" class="form-label">Zip</label>
                <input type="text" class="form-control">
            </div>
        </div>
        <div class="row form-check">
            <input type="checkbox" class="form-check-input">
            <label for="" class="form-check-label">Check Me Out</label>
        </div>
        <div class="row">
            <p class="btn btn-primary w-auto ">Sign In</p>
        </div>
        </form>
       </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
