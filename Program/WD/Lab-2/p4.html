<html>
  <head>
    <title>Types Of List</title>
  </head>
  <body>
    <h1>Ordered List</h1>
    <ol>
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
    </ol>
    <h1>Unordered List</h1>
    <ul type="circle">
      <li>Apple</li>
      <li>Banana</li>
      <li>Mango</li>
    </ul>
    <h1>Definition List</h1>
    <dl>
      <dt>HTML</dt>
      <dd>Hyper Text Markup Language</dd>
    </dl>
  </body>
</html>
