<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAGE</title>
    <style>
        .logo{
            border: 2px solid red; 
            width: 30px;
            text-align: center;
            color: red;
        }
        nav{
            display: flex;
            justify-content: space-between;
        }
        a{
            margin-left: 15px;
            color: red;
        }
        .above{
            position: relative;
            background-image: url(https://img.magnific.com/premium-vector/gradient-orange-rectangles-geometric-shapes-dark-background_23-2148428980.jpg);
            background-repeat: no-repeat;
            background-size:cover;
            height:500px
        }
        .hero{
            position: absolute;
            color: red;
            margin-left: 50px;
            font-size: larger;
        }
        .brand{
            display: flex;
            justify-content: space-between;
        }
        .logo1{
            height: 100px;
            width: 150px;
            border-radius: 10px;
        }
        .exp{
            font-size: 100px;
        }
        .lower-lo{
            display: flex;
        }
        .service{
            display: flex;
        }
        .card{
            border: 5px;
            border-radius: 10px;
            margin-left: 10px;
            background-color: aqua;
            padding: 30px;
            height: 130px;
            width: 100px;
        }
        #card{
            background-color: black;
            color: white;

        }
        .right{
         margin-left: 800px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="above">
           <nav>
            <div class="logo">
            <h1>B</h1>
            </div>
            <div class="anchor">
                <a href="">Home</a>
                <a href="">My Intro</a>
                <a href="">Service</a>
                <a href="">Page</a>
                <a href="">Contact</a>
            </div>
            <div class="enter">
                <input type="text" placeholder="Search" style="border-radius: 10px 0px 0px 10px;">
                <button style="border-radius: 0px 10px 10px 0px; background-color: red;">Search</button>
            </div>
            </nav>
            <div class="hero">
                <h6>Hi, I am Siddharth Trivedi</h6><br>
                <h5>DESIGNER</h5><br>
                <p> I love to work in UI/UX</p>
                <div class="hire">
                <button style="background-color: red; border-radius: 15px;"> Hire Me</button>
            </div>
            </div>
        </div>
        <div class="lower">
            <div class="brand">
                <img class="logo1" src="https://1000logos.net/wp-content/uploads/2021/09/Reliance-Industries-Limited-Logo.png">
                <img class="logo1" src="https://1000logos.net/wp-content/uploads/2023/03/Google-Pay-logo.png">
                <img class="logo1" src="https://vectorseek.com/wp-content/uploads/2024/04/TATA-IPL-Logo-Vector.svg-.png">
                <img class="logo1" src="https://c.ndtvimg.com/2022-02/4ts1faoo_gujarat-titans-logo-facebook_625x300_20_February_22.jpg">
                <img class="logo1" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQc3snxvUF0QdU7wjxH3_JURwmX_NrsELic3tTI4EEe2fFOUTDoKoZLHw4&s=10">
            </div>
            <div class="lower-lo">
                 <div class="left">
                    <h1 class="exp">22</h1><br>
                    <h5>Years of Experience<br>Working</h5>
                 </div>
                 <div class="right">
                    <h5> I am Designer & Developer with a Passion For<br> Web Design  </h5>
                    <div class="service">
                        <div class="card" id="card">
                            <h4>Creative Design</h4><br>
                            <h5>Explore More</h5>
                        </div>
                        <div class="card">
                            <h4>Web Design</h4><br>  
                        </div>
                        <div class="card">
                            <h4>Brand Identity</h4><br>
                        </div>
                    </div>
                 </div>
            </div>
        </div>
    </div>
</body>
</html>
