<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formate</title>
    <style>
      .header {
        background-color: red;
        color: white;
        text-align: center;
        padding: 20px;
        margin-top: 25px;
      }
      .nev {
        width: 20%;
        background-color: blue;
        text-align: center;
        padding: 50px;
        color: white;
        margin: 10px;
        height: 50vh;
        align-content: center;
      }
      .content {
        width: 80%;
        background-color: yellow;
        text-align: center;
        align-content: center;
        margin: 10px;
        height: 62vh;
      }
      .main {
        display: flex;
      }
      .sidebar {
        width: 20%;
        height: 80%;
        color: white;
        background-color: green;
        text-align: center;
        margin: 5px;
        margin-left: 80%;
        align-content: center;
      }
      .footer {
        background-color: skyblue;
        color: white;
        text-align: center;
        padding: 20px;
      }
      .temp{
        align-content: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">Header</div>
      <div class="main">
        <div class="nev">Nevigation</div>
        <div class="content">
          <div class="temp">
          Content
          </div>
          <div class="sidebar">Sidebar</div>
        </div>
      </div>
      <div class="footer">Footer</div>
    </div>
  </body>
</html>
