<html>
  <head>
    <title>EMPLOYEE REGISTRATION</title>
  </head>
  <body align="center">
    <h1>EMPLOYEE REGISTRATION</h1>
    <table align="center" cellpadding="10">
      <form>
        <tr>
          <th colspan="6">Personal Information</th>
        </tr>
        <tr>
          <td>
            <label for="Employee Id">Employee Id</label>
          </td>
          <td align="center">:</td>
          <td>
            <input
              type="text"
              name="Employee Id"
              id="Employee Id"
              placeholder="Enter Employee Id"
            />
          </td>
          <td>
            <label for="Employee Name">Employee Name</label>
          </td>
          <td align="center">:</td>
          <td>
            <input
              type="text"
              name="Name"
              id="Employee Name"
              placeholder="Enter Name"
            />
          </td>
        </tr>
        <tr>
          <td>
            <label for="Email">Email</label>
          </td>
          <td align="center">:</td>
          <td>
            <input
              type="email"
              name="Email"
              id="Email"
              placeholder="Enter Email"
            />
          </td>
          <td>
            <lable for="Contact No.">Contact No.</lable>
          </td>
          <td align="center">:</td>
          <td>
            <input
              type="tel"
              name="Contect No."
              id="Contact No."
              placeholder="Enter Number"
            />
          </td>
        </tr>
        <tr>
          <td>
            <label for="Merital Status">Merital Status:</label>
          </td>
          <td align="center">:</td>
          <td>
            <input
              type="radio"
              name="Merital Status"
              id="Merital Status"
              value="Single"
            />Single
            <input
              type="radio"
              name="Merital Status"
              id="Merital Status"
              value="Married"
            />Married
          </td>
        </tr>
        <tr>
          <th colspan="6">Education Qualification</th>
        </tr>
        <tr>
          <td>
            <label for="Education">Education</label>
          </td>
          <td align="center">:</td>
          <td>
            <input
              type="text"
              name="Education"
              id="Education"
              placeholder="Enter Your Education"
            />
          </td>
          <td>
            <lable for="Experience">Experience</lable>
          </td>
          <td align="center">:</td>
          <td>
            <input
              type="text"
              name="Experience"
              id="Experience"
              placeholder="Enter Your Experience"
            />
          </td>
        </tr>
        <tr>
          <th colspan="6">Job Details</th>
        </tr>
        <tr>
          <td>
            <lable for="Designation">Designation</lable>
          </td>
          <td align="center">:</td>
          <td>
            <input
              type="text"
              name="Designation"
              id="Designation"
              placeholder="Enter Your Designation"
            />
          </td>
          <td>
            <label for="Job Location">Job Location</label>
          </td>
          <td align="center">:</td>
          <td>
            <input
              type="text"
              name="Job Location"
              id="Job Location"
              placeholder="Enter Job Location"
            />
          </td>
        </tr>
        <tr>
          <td>
            <label for="Salary">Salary</label>
          </td>
          <td align="center">:</td>
          <td>
            <input
              type="number"
              name="Salary"
              id="Salary"
              placeholder="Enter Salary"
            />
          </td>
        </tr>
        <tr>
          <td colspan="112"><hr /></td>
        </tr>
        <tr align="center">
          <td colspan="6">
            <input type="submit" name="Register" value="Register" />
          </td>
        </tr>
      </form>
    </table>
  </body>
</html>
